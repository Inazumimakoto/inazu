<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>inazu.me</title>
    <meta name="description" content="稲積誠 / Inazumi Makoto — network, security, AI.">
    <link rel="canonical" href="https://inazu.me/">
    <meta property="og:site_name" content="inazu.me">
    <meta property="og:title" content="inazu.me">
    <meta property="og:description" content="稲積誠 / Inazumi Makoto — network, security, AI.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://inazu.me/">
    <meta property="og:image" content="https://inazu.me/assets/site-icon.png">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="/style.css">
    <script src="/console.js" defer></script>
    <script src="/rotations.js" defer></script>
</head>
<body>
    <!-- プロフィール、制作物、記事、ゲームの記録は Console の inazu にあります。 -->
    <main class="signature">
        <h1 class="brand" aria-label="inazu.me">
            <img class="brand__cat" src="/assets/loader/center.webp" alt="" width="48" height="48">
            <span class="brand__name" aria-hidden="true">inazu</span><span class="brand__tld" aria-hidden="true">.me</span>
        </h1>
        <nav class="orbit" aria-label="研究室同期のサイト">
            <img class="orbit__center" src="/assets/loader/center.webp" alt="" width="92" height="92">
            <a class="orbit__coin orbit__coin--1" href="https://yut4k.com/">
                <img src="/assets/loader/dot-1.webp" alt="yut4k.com" width="46" height="46">
            </a>
            <a class="orbit__coin orbit__coin--2" href="https://nakamurahaya.to/">
                <img src="/assets/loader/dot-2.webp" alt="nakamurahaya.to" width="58" height="58">
            </a>
            <a class="orbit__coin orbit__coin--3" href="https://taisuk.engineer/">
                <img src="/assets/loader/dot-3.webp" alt="taisuk.engineer" width="46" height="46">
            </a>
        </nav>
        <p class="rotations">みんなで <span class="rotations__number"><span class="rotations__total"></span><span class="rotations__pulses" aria-hidden="true"></span></span> 回転</p>
    </main>
</body>
</html>
